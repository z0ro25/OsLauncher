// Top-level build file where you can add configuration options common to all sub-projects/modules.
apply from: "config.gradle"

buildscript {
    ext {
        agp_version = '8.6.1'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()

        maven {
            url 'https://maven.google.com/'
        }

        maven {
            url = uri("https://maven.pkg.github.com/z0ro25/FSD-ADS")
            credentials {
                username = providers.gradleProperty("GITHUB_USERNAME").orElse("").get()
                password = providers.gradleProperty("GITHUB_TOKEN").orElse("").get()
            }
        }

        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }

        maven { url 'https://android-sdk.is.com/' }
        maven {
            url 'https://artifact.bytedance.com/repository/pangle/'
        }
        maven {
            url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'

        }
    }
    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        // Kotlin 1.9.24 -> 2.1.21: BẮT BUỘC, không phải nâng cho mới.
        // play-services-ads:24.6.0 do Google build bằng Kotlin 2.1.0, nên các file
        // META-INF/*.kotlin_module nằm BÊN TRONG AAR mang metadata 2.1.0. Compiler 1.9.24 chỉ đọc
        // được tới 2.0.0 (JvmMetadataVersion.INSTANCE_NEXT = next(1.9.0) = [2,0,0]) nên báo
        // "Module was compiled with an incompatible version of Kotlin".
        // Ép kotlin-stdlib trên classpath KHÔNG vá được lỗi này: .kotlin_module nằm trong api.jar
        // của play-services-ads, không phải một artifact trên classpath. Chỉ nâng compiler mới hết.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.21"
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.2'
    }
}

allprojects {
    repositories {
        // jcenter() đã gỡ: dịch vụ ngừng hoạt động (read-only từ 2021, tắt hẳn 2022) nên chỉ làm
        // build chậm vì phải chờ timeout. Các thư viện cần thiết đều có ở mavenCentral/jitpack.
        mavenCentral()
        google()

        maven {
            url 'https://maven.google.com'
        }

        maven {
            url = uri("https://maven.pkg.github.com/z0ro25/FSD-ADS")
            credentials {
                username = providers.gradleProperty("GITHUB_USERNAME").orElse("").get()
                password = providers.gradleProperty("GITHUB_TOKEN").orElse("").get()
            }
        }

        maven { url 'https://jitpack.io' }
        maven { url 'https://maven.aliyun.com/repository/jcenter' }

        maven { url 'https://android-sdk.is.com/' }
        maven {
            url 'https://artifact.bytedance.com/repository/pangle/'
        }
        maven {
            url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_oversea'
        }



        maven {
            url "https://github.com/DroiBaaS/DroiBaaS-SDK-Android/raw/master/"
        }

        maven {
            url "https://github.com/IDroi/AdZodiac/raw/master/"
        }


        flatDir {
            dirs 'libs'
            dirs '../libs'
            dirs '../../libs'
        }

        maven { url = uri("$rootDir/libs/maven") }

        maven {
            url = uri("https://maven.pkg.github.com/z0ro25/FSD-ADS")
            credentials {
                username = providers.gradleProperty("GITHUB_USERNAME").orElse("").get()
                password = providers.gradleProperty("GITHUB_TOKEN").orElse("").get()
            }
        }

        // [GỠ] -Xbootclasspath/p: JDK 17 KHÔNG còn hỗ trợ cờ này (bỏ từ JDK 9, thay bằng
        //   --patch-module). Giữ lại sẽ làm javac lỗi ngay. Plugin PowerKey vốn đã bị comment ở
        //   app/build.gradle (compileOnly framework.jar) nên không có gì phụ thuộc cờ này.
    }

    // [GỠ] Khối force kotlin-stdlib:1.9.24 trên compileClasspath.
    //
    // Khối đó chỉ tồn tại để compiler 1.9.24 không gặp metadata 2.1.0 của kotlin-stdlib mà
    // play-services-ads kéo vào — đúng như phần "BẤT BIẾN" của chính nó đã ghi. Nay compiler
    // là 2.1.21 (đọc được tới metadata 2.2.0) nên khối này không còn cần thiết; giữ lại thì
    // nó lại ép NGƯỢC về stdlib cũ — sai hướng.
    //
    // Lưu ý: khối này chỉ vá được lỗi metadata của kotlin-stdlib. Lỗi "Module was compiled
    // with an incompatible version of Kotlin" từ các file META-INF/*.kotlin_module nằm bên
    // trong api.jar của play-services-ads thì nó KHÔNG chạm tới — chỉ nâng compiler mới hết.
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

def buildTime() {
    return new Date().format("yyyy-MM-dd HH:mm:ss", TimeZone.getTimeZone("GMT+8"))
}
