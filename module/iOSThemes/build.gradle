apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.ezla.oslauncher.themes"
    compileSdkVersion cfgs.compileSdkVersion

    defaultConfig {
        minSdkVersion cfgs.minSdkVersion
        targetSdkVersion cfgs.targetSdkVersion

        // deviceBootstrapSecret của SAG (32 byte, md §3). Đọc từ gradle.properties global -> KHÔNG commit.
        buildConfigField "String", "SAG_BOOTSTRAP_SECRET",
                "\"${providers.gradleProperty('SAG_BOOTSTRAP_SECRET').orElse('').get()}\""
    }
    resourcePrefix 'themes'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    // lifecycleScope cho repository suspend; cùng bản với :app.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    // Dot indicator cho onboarding: cùng thư viện :app dùng (dotsWidthFactor -> dot active dài ra).
    implementation 'com.tbuonomo:dotsindicator:4.3'
    implementation 'com.google.android.material:material:1.11.0'
    // Cùng bản với :app/iOSLauncher để graph chỉ resolve một Glide.
    implementation "com.github.bumptech.glide:glide:4.13.2"

    // Gọi API theme. Cùng bản với :app/iOSLiteCommon/iOSSearch; Retrofit 2.9 hỗ trợ sẵn suspend fun
    // nên không cần adapter RxJava như các module kia.
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"
    // SAG: ký request hardware-backed (Android Keystore + Key Attestation). AAR tự mang native
    // .so + consumer ProGuard + quyền INTERNET; POM tự khai OkHttp 4.12.0 (sẽ bump transitive).
    implementation 'com.mct.libs:sag:1.0.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation project(':library:iOSLiteCommon')
    implementation project(':module:iOSLauncher')
    // Ảnh theme mặc định (preview, wallpaper, icon) cho màn Mine.
    implementation project(':library:ThemeResource:ThemeDefault')
}
