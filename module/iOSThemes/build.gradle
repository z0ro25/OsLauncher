apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.ezla.oslauncher.themes"
    compileSdkVersion cfgs.compileSdkVersion

    defaultConfig {
        minSdkVersion cfgs.minSdkVersion
        targetSdkVersion cfgs.targetSdkVersion
    }
    resourcePrefix 'themes'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.fragment:fragment-ktx:1.6.2'
    // lifecycleScope cho repository suspend; cùng bản với :app.
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    // Cùng bản với :app/iOSLauncher để graph chỉ resolve một Glide.
    implementation "com.github.bumptech.glide:glide:4.13.2"

    // Gọi API theme. Cùng bản với :app/iOSLiteCommon/iOSSearch; Retrofit 2.9 hỗ trợ sẵn suspend fun
    // nên không cần adapter RxJava như các module kia.
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation project(':library:iOSLiteCommon')
    implementation project(':module:iOSLauncher')
    // Ảnh theme mặc định (preview, wallpaper, icon) cho màn Mine.
    implementation project(':library:ThemeResource:ThemeDefault')
}
