apply plugin: 'com.android.library'

android {
    namespace "com.truongnt.ios.themeclub"
    compileSdkVersion cfgs.compileSdkVersion

    defaultConfig {
        minSdkVersion cfgs.minSdkVersion
        targetSdkVersion cfgs.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    resourcePrefix 'themeclub'

    buildFeatures {
        // for view binding:
        buildConfig = true
    }
}

allprojects {
    repositories {
        jcenter()
        maven { url "https://jitpack.io" }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
//    implementation libs['appcompat-v7']
    implementation libs['design']
    implementation "com.github.bumptech.glide:glide:3.7.0"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation project(':library:iOSLiteCommon')
    implementation project(':library:ThemeResource:ThemeDefault')
    implementation project(':module:iOSLauncher')
    implementation project(':library:cropper')
    implementation 'com.makeramen:roundedimageview:2.3.0'
    implementation 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.34'

    // Room (Java) — migrate SQLite thủ công sang Room
    // 2.6.1 -> 2.7.2: BẮT BUỘC khi compiler Kotlin là 2.1.x (xem build.gradle gốc).
    // room-compiler 2.6.1 dùng kotlinx-metadata-jvm — chỉ đọc được metadata tới 2.0.0 — nên kapt
    // báo "Provided Metadata instance has version 2.1.0". Từ 2.7.0 Room dùng kotlin-metadata-jvm.
    implementation "androidx.room:room-runtime:2.7.2"
    annotationProcessor "androidx.room:room-compiler:2.7.2"
}
