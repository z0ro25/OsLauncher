apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace "com.ezla.oslauncher.calculator"
    compileSdkVersion cfgs.compileSdkVersion

    defaultConfig {
        minSdkVersion cfgs.minSdkVersion
        targetSdkVersion cfgs.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
    }
    // Prefix bắt buộc: resource module gộp chung namespace R với :app khi build.
    resourcePrefix 'calc'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.11.0'
    // BaseActivity dùng chung của các app tiện ích (locale, banner, ẩn nav bar).
    implementation project(':library:OSAppBase')
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
