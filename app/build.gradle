    implementation 'com.google.android.play:review:2.0.1'
    //gson
    implementation 'com.google.code.gson:gson:2.9.1'

//    implementation libs['multidex']
    implementation project(':module:iOSLauncher')
    implementation project(':module:iOSSettings')
//    compile project(':module:IOSWeather')
    implementation project(':module:iOSThemeClub')
    implementation project(':module:iOSSearch')
//    compile project(':module:IOSNewsPage')
//    compile project(':module:IOSDiscovery')
    implementation project(':library:iOSLiteCommon')

