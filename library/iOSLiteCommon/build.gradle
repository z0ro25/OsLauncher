//    }
//
//    compile(libs['droi-bass-analytics']) {
//        changing = true
//    }
//    compile libs['okhttp-urlconnection']
//    compile libs['okhttp']
    api libs['gson']
    implementation libs['support-v4']
//    implementation libs['recyclerview-v7']
//    api libs['appcompat-v7']
//    api libs['cardview-v7']
    api libs['palette-v7']
//    compile libs['umeng']
