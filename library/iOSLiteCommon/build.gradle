apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
//
    namespace "com.truongnt.ios.ioslite.common"
    compileSdkVersion cfgs.compileSdkVersion

    defaultConfig {
        buildConfigField "Boolean", "LOG_ENABLE", "true"

        minSdkVersion 24
        targetSdkVersion cfgs.targetSdkVersion
        versionCode 100
        versionName "1.0.0"
    }

    buildFeatures {
        buildConfig true
    }

    useLibrary 'org.apache.http.legacy'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src', "Volley/src"]
            // Package `ads` viết bằng Kotlin nhưng nằm chung cây `src` với phần Java.
            // Mặc định của kotlin-android là src/main/java + src/main/kotlin nên không thấy file.
            kotlin.srcDirs = ['src', "Volley/src"]
            resources.srcDirs = ['src']
            aidl.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
            jniLibs.srcDirs = ['libs']
        }
    }
}

dependencies {
    api files('libs/launcher_client.jar')
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'

    // Room (Java) — migrate SQLite thủ công sang Room
    // 2.6.1 -> 2.7.2: BẮT BUỘC khi compiler Kotlin là 2.1.x (xem build.gradle gốc).
    // room-compiler 2.6.1 dùng kotlinx-metadata-jvm — chỉ đọc được metadata tới 2.0.0 — nên kapt
    // báo "Provided Metadata instance has version 2.1.0". Từ 2.7.0 Room dùng kotlin-metadata-jvm.
    implementation "androidx.room:room-runtime:2.7.2"
    annotationProcessor "androidx.room:room-compiler:2.7.2"

    implementation "androidx.work:work-runtime:2.7.1"

    implementation 'androidx.appcompat:appcompat:1.7.0'

    implementation files('libs/slf4j-api-1.7.6.jar')

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    api libs['gson']
    implementation libs['support-v4']

    api libs['palette-v7']

    //ads — SDK eztech. `api` vì iOSLauncher/iOSSearch/iOSThemeClub gọi thẳng class của SDK.
    // Nơi khai DUY NHẤT của AAR: khai thêm ở module khác là D8 báo "defined multiple times".
    api files('libs/eztech-ads-com.ezla.oslauncher.beautylauncher-1.0.8.aar')

    // AAR cục bộ KHÔNG mang metadata dependency, nên các thư viện mà SDK eztech cần phải
    // khai tường minh. Để `api` vì chữ ký hàm của SDK có kiểu của ads-mobile-sdk, module gọi
    // vào (iOSLauncher/iOSSearch/iOSThemeClub) cũng phải nạp được kiểu đó mới biên dịch.
    api 'com.google.android.libraries.ads.mobile.sdk:ads-mobile-sdk:1.4.0'
    api 'androidx.lifecycle:lifecycle-process:2.9.0'
    // AppAds (config/) dùng coroutine + Dispatchers.Main; 1.9.0 = đúng bản graph đang resolve.
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'

    implementation("com.facebook.shimmer:shimmer:0.5.0")
}

/*
 * [BẮT BUỘC] Vá lỗi "cannot access ListenableFuture" khi biên dịch DailyNotiWorker.
 *
 * Cơ chế lỗi:
 *   - DailyNotiWorker kế thừa androidx.work.Worker, mà ListenableWorker.getForegroundInfoAsync()
 *     trả về com.google.common.util.concurrent.ListenableFuture -> javac phải nạp được class đó
 *     mới dịch được lớp con.
 *   - 2 thư viện ads ở trên (play-services-ads -> androidx.privacysandbox.ads:ads-adservices-java)
 *     kéo com.google.guava:guava:31.1-android vào graph, nhưng CHỈ ở runtime (guava là dep
 *     'implementation' của ads-adservices-java nên không expose ra compile).
 *   - Guava lại ghim 'listenablefuture' lên bản 9999.0-empty-to-avoid-conflict-with-guava — một jar
 *     RỖNG (0 class), tồn tại chỉ để nhường chỗ cho class thật nằm trong guava. Gradle chọn version
 *     cao nhất nên bản rỗng thắng bản 1.0 -> compileClasspath không còn class nào cả.
 *
 * Cách vá: ép 'listenablefuture' về lại 1.0 — jar 1.0 chứa đúng một class là ListenableFuture.class
 * (bản stub do chính androidx.work khai báo, đủ để javac dịch). KHÔNG thêm thư viện nào mới.
 *
 * CHỈ ép trên classpath BIÊN DỊCH, KHÔNG ép ở runtime: ở runtime guava đã cung cấp class thật rồi,
 * ép ở runtime sẽ khiến APK có 2 bản ListenableFuture -> D8 báo "Type ... is defined multiple times".
 *
 * BẤT BIẾN: nếu sau này bỏ 2 dòng ads ở trên thì lỗi này tự hết (graph không còn guava) và có thể
 * gỡ luôn khối này. Ngược lại, thêm class nào khác kế thừa Worker/ListenableWorker ở :app thì phải
 * áp cách vá tương tự cho :app (compileClasspath của :app cũng đang bị đẩy lên bản rỗng).
 */
configurations.all { cfg ->
    if (cfg.name.endsWith('CompileClasspath')) {
        cfg.resolutionStrategy.force 'com.google.guava:listenablefuture:1.0'
    }
}
