apply plugin: 'com.android.library'

android {
    namespace "com.amz.ios.newssource"
    compileSdkVersion cfgs.compileSdkVersion

    defaultConfig {
        minSdkVersion cfgs.minSdkVersion
        targetSdkVersion cfgs.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Đã gỡ hết thư viện cục bộ trong libs/:
    //  - droiselfupdate-1.1.019.jar: SDK tự cập nhật của Droi (tải + cài APK). Code khởi tạo
    //    (ThirdPartAdManager.initialDroiUpdate) đã bị comment toàn bộ và không ai gọi.
    //  - commons-lang3-3.5.jar: không có chỗ nào dùng (org.apache.commons).
    //  - adzodiac / inmobi / audience-network / fresco / infohub / ads: SDK QUẢNG CÁO, đều đã
    //    bị comment từ trước. Gỡ hẳn để không thể bật lại nhầm.

    // Retrofit
    implementation "com.squareup.retrofit2:retrofit:2.9.0"
    implementation "com.squareup.retrofit2:converter-gson:2.9.0"
    implementation "com.squareup.okhttp3:okhttp:4.11.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.11.0"
    implementation 'com.squareup.retrofit2:adapter-rxjava3:2.9.0'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation libs['cardview-v7']
    implementation libs['design']
    implementation project(':library:iOSLiteCommon')
}