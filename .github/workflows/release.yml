name: Build Signed AAB

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${RUNNER_TEMP}/release.keystore"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # ORG_GRADLE_PROJECT_<tên> = gradle property <tên>: thay cho ~/.gradle/gradle.properties ở máy local
      # (credential GitHub Packages MCT-LIB và SAG_BOOTSTRAP_SECRET).
      - name: Build signed AAB
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_gprUserMCT: ${{ secrets.MCT_GPR_USER }}
          ORG_GRADLE_PROJECT_gprKeyMCT: ${{ secrets.MCT_GPR_KEY }}
          ORG_GRADLE_PROJECT_SAG_BOOTSTRAP_SECRET: ${{ secrets.SAG_BOOTSTRAP_SECRET }}
        run: ./gradlew :app:bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          # Tên file do archivesBaseName đặt (MiOS_Launcher_26_v..._<ngày>-release.aab), không phải app-release.aab.
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7
